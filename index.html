<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8efe0">
  <meta name="description" content="Esplora i consumi di energia dell’industria e dei servizi in Svizzera, dal 2002 al 2025. Bozza interattiva del kit 10.">
  <title>Consumo di energia nel settore industriale e dei servizi</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="style.css">
  <script defer src="data.js"></script>
  <script defer src="main.js"></script>
</head>
<body>
  <div class="page-shell">
    <header class="page-header">
      <h1>Consumo di energia nel settore industriale e dei servizi</h1>
      <a class="source-link" href="https://pubdb.bfe.admin.ch/it/sammlungen/energiestatistik-energieverbrauch-in-der-industrie-und-im-dienstleistungssektor" target="_blank" rel="noopener noreferrer">FONTE: UFFICIO FEDERALE DELL’ENERGIA UFE <span aria-hidden="true">↗</span></a>
    </header>

    <div class="view-controls">
      <div class="view-switch" role="group" aria-label="Scegli la visualizzazione">
        <button type="button" class="active" data-view="share" aria-pressed="true">Chi consuma?</button>
        <button type="button" data-view="trend" aria-pressed="false">Come cambia?</button>
      </div>
    </div>

    <main>
      <div class="explore-bar">
        <div class="scope-switch" role="group" aria-label="Scegli cosa esplorare">
          <button type="button" data-scope="all" class="active" aria-pressed="true"><span class="scope-swatch" aria-hidden="true"></span><span class="scope-label">Panoramica</span></button>
          <button type="button" data-scope="industry" aria-pressed="false"><span class="scope-swatch" aria-hidden="true"></span><span class="scope-label">Industria e costruzioni</span></button>
          <button type="button" data-scope="services" aria-pressed="false"><span class="scope-swatch" aria-hidden="true"></span><span class="scope-label">Servizi</span></button>
        </div>
      </div>

      <section id="share-view" class="share-view" aria-label="Ripartizione dei consumi">
        <div class="donut-panel">
          <div class="donut-wrap">
            <svg id="donut" viewBox="0 0 450 450" role="group" aria-label="Ripartizione dei consumi per categoria"></svg>
            <div class="donut-center" aria-live="polite" aria-atomic="true"><strong id="center-value">—</strong><span class="unit">TJ</span></div>
          </div>
        </div>
      </section>

      <section id="trend-view" class="trend-view" aria-label="Andamento dei consumi" hidden>
        <div class="trend-heading"><div class="metric-switch" role="group" aria-label="Come confrontare i consumi"><button type="button" data-metric="absolute" class="active" aria-pressed="true">Consumi</button><button type="button" data-metric="change" aria-pressed="false">Variazione dal 2002</button></div></div>
        <div class="line-chart-wrap"><svg id="line-chart" viewBox="0 0 1120 340" role="img" aria-label="Andamento annuale dei consumi dal 2002 al 2025"></svg><div id="chart-tooltip" class="chart-tooltip" hidden></div></div>
        <p class="legend-help">Tocca un nome per seguire la sua linea. Toccalo di nuovo per tornare al confronto.</p>
        <div id="trend-legend" class="trend-legend" role="group" aria-label="Evidenzia una linea senza nascondere gli altri settori"></div>
      </section>

      <section class="timeline" aria-label="Scegli l’anno">
        <button type="button" id="play" class="play-button" aria-label="Riproduci gli anni" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5L19 12L8 19Z" fill="currentColor"/></svg></button>
        <div class="slider-wrap"><input type="range" id="year-slider" min="2002" max="2025" step="1" value="2025" aria-label="Anno visualizzato"></div>
        <output class="year-output" for="year-slider" id="year-output">2025</output>
      </section>

      <div class="categories-panel"><div id="category-grid" class="category-grid"></div></div>

    </main>

  </div>

</body>
</html>
